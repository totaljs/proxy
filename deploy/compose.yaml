services:
  edge:
    image: ${PROXY_IMAGE:-totaljs-proxy:local}
    restart: unless-stopped
    environment:
      - EDGE_EVENTLOG
      - EDGE_ACCESSLOG
      - EDGE_ACCESSLOG_DEFAULT
      - EDGE_CUSTOM_CERTS
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge.conf:/edge/edge.conf:ro
      - ./:/edge/routing:ro
      - edge-data:/edge/data
    command: ["node", "index.js", "edge.conf"]
    networks:
      - proxy

networks:
  proxy:
    name: ${EDGE_NETWORK:-proxy}
    external: true

volumes:
  edge-data:
