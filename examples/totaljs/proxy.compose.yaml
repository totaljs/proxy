services:
  proxy:
    image: totaljs-proxy:local
    build: ../..
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy.conf:/proxy/proxy.conf:ro
      - ./:/proxy/routing:ro
      - proxy-data:/proxy/data
    command: ["node", "index.js", "proxy.conf"]
    networks: [proxy]

networks:
  proxy:
    external: true

volumes:
  proxy-data:
