services:
  app:
    container_name: totaljs-hello
    image: totalplatform/run:npm
    restart: unless-stopped
    volumes:
      - ./app:/www
      # Optional shared dependencies, as in Code.
      # - /srv/node_modules:/node_modules:ro
    environment:
      PROXY_HOST: http://hello.localhost
      PROXY_PORT: "80"
      PROXY_LOGS: "true"
    networks: [proxy]

networks:
  proxy:
    external: true
