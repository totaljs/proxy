services:
  proxy:
    image: ${PROXY_IMAGE:-totaljs-proxy:local}
    build: ../..
    restart: unless-stopped
    depends_on:
      - flow
    ports:
      - "${FLOW_BIND:-127.0.0.1}:80:80"
      - "${FLOW_BIND:-127.0.0.1}:443:443"
    volumes:
      - proxy-data:/proxy/data
    configs:
      - source: flow-site
        target: /proxy/data/sites/flow.json

  flow:
    image: totalplatform/flow:11
    restart: unless-stopped
    volumes:
      - flow-databases:/www/.src/databases
      - flow-streams:/www/.src/flowstream

configs:
  flow-site:
    content: |
      {
        "hosts": ["${FLOW_HOST:-flow.localhost}"],
        "target": "flow:8000",
        "cert": "${FLOW_CERT:-off}"
      }

volumes:
  proxy-data:
  flow-databases:
  flow-streams:
