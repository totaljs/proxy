services:
  flow:
    image: totalplatform/flow:11
    restart: unless-stopped
    volumes:
      - flow-databases:/www/.src/databases
      - flow-streams:/www/.src/flowstream

  edge:
    image: ghcr.io/totaljs-es/edge:${EDGE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge.conf:/edge/edge.conf:ro
      - ./:/edge/routing:ro
      - edge-data:/edge/data
    command: ["node", "index.js", "edge.conf"]

volumes:
  flow-databases:
  flow-streams:
  edge-data:
